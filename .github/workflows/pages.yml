      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Check all article images and reader controls
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { pathToFileURL } = require('node:url');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto(pathToFileURL(process.cwd() + '/dist/index.html').href);
              await page.locator('#stories img').first().waitFor();
              const images = await page.locator('#stories').evaluate(async list => {
                const imgs = [...list.querySelectorAll('img')];
                imgs.forEach(img => { img.loading = 'eager'; });
                await Promise.all(imgs.map(img => img.decode()));
                return imgs.length;
              });
              assert.equal(images, 24);
              await page.locator('#theme').press('Space');
              await page.locator('#lang').click();
              await page.locator('#search').fill('Wyrmspan');
              assert.equal(await page.locator('#stories img').count(), 1);
              await page.locator('#stories').getByRole('button', {name: /Wyrmspan/}).first().click();
              assert.deepEqual(errors, []);
              console.log('24 images, theme, language, search and details verified.');
              await page.goto(pathToFileURL(process.cwd() + '/dist/2026-11-28/index.html').href);
              await page.locator('#stories img').first().waitFor();
              const saturday = await page.locator('#stories').evaluate(async list => {
                const imgs = [...list.querySelectorAll('img')];
                imgs.forEach(img => { img.loading = 'eager'; });
                await Promise.all(imgs.map(img => img.decode()));
                return {images: imgs.length, stories: list.querySelectorAll('h3').length};
              });
              assert.equal(saturday.images, 23);
              assert.equal(saturday.stories, 23);
              assert.deepEqual(errors, []);
              console.log('November 28 reader verified: 23 articles, 23 loaded images.');
              await page.goto(pathToFileURL(process.cwd() + '/dist/rehearsal-2026-11-27/index.html').href);
              await page.locator('#stories img').first().waitFor();
              const rehearsal = await page.locator('#stories img').evaluateAll(async images => {
                images.forEach(img => { img.loading = 'eager'; });
                await Promise.all(images.map(img => img.decode()));
                return images.length;
              });
              assert.equal(rehearsal, 6);
              assert.deepEqual(errors, []);
              console.log('Rehearsal reader tested: 6 articles, 6 decoded images.');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
