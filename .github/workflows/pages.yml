          illustration_dir = Path('editorial/2026-11-28/illustrations')
          sheets = {}
          for asset in illustration_layout:
              name = asset['filename']
              if name not in sheets:
                  sheets[name] = Image.open(illustration_dir / name).convert('RGB')
              sheet = sheets[name]
              row, column = divmod(asset['cell'], asset['columns'])
              w, h = sheet.size
              x0, x1 = w * column // asset['columns'], w * (column + 1) // asset['columns']
              y0, y1 = h * row // asset['rows'], h * (row + 1) // asset['rows']
              image = sheet.crop((x0 + 2, y0 + 2, x1 - 2, y1 - 2))
              image.save(saturday / asset['image']['large'], 'WEBP', quality=87, method=4)
              tomorrow['items'][asset['index'] - 1]['image'] = asset['image']
          assert all(item.get('image') for item in tomorrow['items'])
          for filename in ('app.js', 'reader-layout.css', 'reader-motion.css'):
              (saturday / filename).write_bytes((output / filename).read_bytes())
          saturday_payload = json.dumps(tomorrow, ensure_ascii=False, separators=(',', ':')).replace('<', '\\u003c')
          saturday_html = html[:embedded.start(1)] + saturday_payload + html[embedded.end(1):]
          (saturday / 'index.html').write_text(saturday_html, encoding='utf-8')
          print('Prepared the distinct November 28 reader with 26 stories and 26 images.')
