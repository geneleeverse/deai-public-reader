name: Publish the illustrated November 27 DEAI issue
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.2.0'
      - name: Build the reader from the public issue and its image sources
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          origin = 'https://deai-4945ab4a30cd1148f59a772a.briskbox23.chatgpt.site'
          assets = [
              ('PlayStation.Blog', 'https://blog.playstation.com/tachyon/2026/11/fd8023623ccb61c2b195870ea714209ebf52e951.jpg'),
              ('Xbox Wire / Koei Tecmo', 'https://xboxwire.thesourcemediaassets.com/sites/2/2026/11/Nioh-3-Key-Art-Logo-1f9702a7ae1d63984be4.jpg'),
              ('PlayStation.Blog', 'https://blog.playstation.com/tachyon/2026/11/bc4af3b9af7eabe20204f2228edee81050b007ef.jpg'),
              ('NVIDIA', 'https://developer-blogs.nvidia.com/wp-content/uploads/2026/11/Featured-War-Thunder-DLSS-5-on.webp'),
              None,
              None,
              ('DigitalMarsh / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/5548360/bbf19c2fa0e5f26f125b016079c110cbf0bf6be1/capsule_616x353.jpg?t=1795692222'),
              ('Where Winds Meet', 'https://yysls-build-na.fp.ps.easebar.com/file/69118e9af5a2b7775166e5c6e0Q84oZo03'),
              ('Sand.ai', 'https://static.magi.world/media/website/6c8334773b98eca3de5b02c0460740cef8802c111e173bd32de5a1f1f4d3d884.webp'),
              None,
              None,
              ('Alibaba Cloud', 'https://img.alicdn.com/imgextra/i1/O1CN012QgtoH1c1Mu70xD3w_!!6000000003540-2-tps-640-640.png'),
              None,
              ('Monster Couch / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3339080/52a32c6809f6aa0c09db260c8a01f92e02f8137f/capsule_616x353.jpg?t=1789635022'),
              ('Longplay Studios / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/4416390/bbe14fc63d1bd5324e6d18445a39e108b6e81f97/capsule_616x353.jpg?t=1795700972'),
              ('Glitch Factory / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3015820/1aa74007785bbd9e2dc8bc6c434b98c8d8837c10/capsule_616x353.jpg?t=1795541357'),
              ('RedBoon / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/5590100/93c8ba4761489a22807e52fdeb0b5cac13b75c2f/capsule_616x353.jpg?t=1794818774'),
              ('Athelan Games / Steam', 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3572070/af86ed5b28e439a6069be97351a5ce07c4fb64e9/capsule_616x353.jpg?t=1795630942'),
              ('MovieChart', 'https://www.moviechart.co.kr/thumb?width=178&height=267&m_code=20257275&source=https://admin.moviechart.co.kr/assets/upload/movie/261113003508_7157.jpg'),
              ('Walt Disney Animation Studios', 'https://lumiere-a.akamaihd.net/v1/images/p_disneymovies_hexed_v2_fd40921f.jpeg?region=0%2C0%2C540%2C810'),
              ('Sunrise', 'https://www.votoms-gh.com/assets/img/ogp_1023.png'),
              ('IDFA', 'https://optimise2.assets-servd.host/idfa-cms/production/uploads/Photos/news/WnW_1.jpg?w=2560&fm=jpeg&auto=compress&fit=crop&dm=1795164952&s=33a1949550c233d09de4c941fc2f60b3'),
              ('Tallinn Black Nights Film Festival', 'https://assets.poff.ee/img/F_2_On_Top_of_the_Cliff_8eddf08ca0_big_16_9.jpeg'),
              None,
          ]

          def fetch(url, referer):
              headers = {'User-Agent': 'Mozilla/5.0 (compatible; DEAI private rehearsal/1.0)', 'Referer': referer}
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  data = response.read(16_000_001)
                  if not response.geturl().startswith('https://') or len(data) > 16_000_000:
                      raise ValueError('Unexpected response: ' + url)
                  return data

          output = Path('dist')
          (output / 'media').mkdir(parents=True)
          html = fetch(origin + '/i-64b0c73f5e515dc55f250158', origin).decode()
          embedded = re.search(r'<script type="application/json" id="test-edition-data">(.*?)</script>', html, re.S)
          edition = json.loads(embedded[1])
          raw = json.dumps(edition, sort_keys=True, ensure_ascii=False, separators=(',', ':')).encode()
          assert hashlib.sha256(raw).hexdigest() == 'e12047f3d32453d2a6d2d9a6b92798d13f5a0c30fae4eaf85468fa503a4d1803'
          assert edition['issue'] == '2026-11-27' and edition['status'] == 'approved' and len(edition['items']) == 24
          assert 'noindex' in html

          def prepare(job):
              index, (story, asset) = job
              if asset:
                  credit, source = asset
                  metadata = {'alt': story['title'] + ' 관련 이미지', 'altEn': 'Artwork for ' + story['titleEn'], 'credit': credit}
              else:
                  metadata = story['image']
                  source = origin + '/' + metadata['large']
              path = f'media/nov27-{index:02}.webp'
              referer = story['url'] if asset else origin
              steam_app = re.search(r'/steam/apps/(d+)/', source)
              if steam_app:
                  referer = 'https://store.steampowered.com/app/' + steam_app[1] + '/'
              if index == 19:
                  referer = 'https://www.moviechart.co.kr/info/movieinfo/photo/20257275?idx=126430'
              try:
                  content = fetch(source, referer)
              except Exception as error:
                  raise RuntimeError(f'Image {index} could not be read at {source}: {error}') from error
              with Image.open(io.BytesIO(content)) as image:
                  image = ImageOps.exif_transpose(image)
                  image.thumbnail((1150, 800))
                  image.save(output / path, 'WEBP', quality=86, method=4)
              story['image'] = {**metadata, 'small': path, 'large': path}
              return {'title': story['titleEn'], 'credit': metadata['credit'], 'url': source}

          with ThreadPoolExecutor(max_workers=12) as pool:
              sources = list(pool.map(prepare, enumerate(zip(edition['items'], assets, strict=True), 1)))
          payload = json.dumps(edition, ensure_ascii=False, separators=(',', ':')).replace('<', '\u003c')
          (output / 'index.html').write_text(html[:embedded.start(1)] + payload + html[embedded.end(1):], encoding='utf-8')
          for filename in ('app.js', 'reader-layout.css', 'reader-motion.css'):
              (output / filename).write_bytes(fetch(origin + '/' + filename, origin))
          (output / 'image-sources.json').write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Prepared 24 approved articles and 24 images.')

          original = json.loads(embedded[1])
          carry = [story for story in original['items'] if story['date'] >= '2026-11-21']
          additions = json.loads(r'''[{"category":"게임 산업","date":"2026-11-26","source":"Infold Games / PlayStation.Blog","title":"《인피니티 니키》 3.0, PS5에 두 도시 추가","titleEn":"Infinity Nikki 3.0 adds two cities on PS5","summary":"인폴드 게임즈는 11월 26일 PS5용 《인피니티 니키》 3.0 업데이트를 발표했다. 니키와 모모는 치치아와 세레미우스 두 도시를 탐험하며, 개발사는 새 이야기가 약 10시간 분량이라고 밝혔다. 새 탐험 능력과 확장된 전투 시스템도 추가됐다.","summaryEn":"Infold Games announced the November 26 release of Infinity Nikki 3.0 on PS5. Nikki and Momo explore the cities of Cicia and Ceremius in a new story that the developer says runs nearly 10 hours. The update also expands combat and introduces new exploration abilities.","url":"https://blog.playstation.com/2026/11/26/infinity-nikki-version-3-0-of-yesterday-and-tomorrow-update-live-today-on-ps5/","score":91,"status":"approved","summaryOrigin":"ai_assisted"},{"category":"게임 산업","date":"2026-11-27","source":"Bonfire Studios","title":"《Arkheron》, 콘솔과 스팀 얼리 액세스","titleEn":"Arkheron enters early access on consoles and Steam","summary":"본파이어 스튜디오는 11월 27일 PS5, Xbox Series X|S, 스팀에서 《Arkheron》 얼리 액세스를 시작한다고 안내했다. 3인 팀이 탑을 오르며 장비를 모아 경쟁하는 PvP 게임이다. 무료 프렌드 패스로 출시 주말에는 게임 전체를 체험할 수 있다.","summaryEn":"Bonfire Studios set November 27 as the early-access launch date for Arkheron on PS5, Xbox Series X|S, and Steam. Teams of three climb a tower, collect equipment, and fight rival teams in PvP. The free Friend Pass opens the full game to players during launch weekend.","url":"https://www.arkheron.com/en_US/play/","score":89,"status":"approved","summaryOrigin":"ai_assisted"},{"category":"Unity","date":"2026-11-23","source":"Unity","title":"Unity 6.7, 신경망 기반 텍스처 압축 실험","titleEn":"Unity 6.7 experiments with neural texture compression","summary":"유니티는 Unity 6.7에 신경망 렌더링을 실험 기능으로 제공한다고 설명했다. 신경망 텍스처 압축은 URP 텍스처 세트를 압축한 뒤 실행 중 작은 신경망으로 복원한다. 유니티는 일반적인 URP 텍스처 세트에서 BCn 대비 메모리를 50% 적게 썼으며, 정식 지원은 Unity 7을 목표로 한다고 밝혔다.","summaryEn":"Unity outlined its experimental neural rendering support for Unity 6.7. Neural texture compression encodes URP texture sets and reconstructs them at runtime with a small neural network. Unity reported 50 percent lower memory use than BCn for a typical URP texture set and plans supported release in Unity 7.","url":"https://discussions.unity.com/t/neural-texture-compression-in-unity-6-7/1742548/1","score":90,"status":"approved","summaryOrigin":"ai_assisted"},{"category":"영화","date":"2026-11-27","source":"Bulldog Film Distribution","title":"윤가은 감독 《세계의 주인》 영국 극장 개봉","titleEn":"Yoon Ga-eun’s The World of Love opens in UK cinemas","summary":"불독 필름 디스트리뷰션은 윤가은 감독의 《세계의 주인》을 11월 27일부터 영국 일부 극장에서 상영한다고 밝혔다. 첫 상영관에는 런던 커즌 블룸즈버리와 에든버러 필름하우스가 포함된다. 서수빈이 연기한 열일곱 살 주인에게 익명의 쪽지가 도착하면서 이야기가 시작된다.","summaryEn":"Bulldog Film Distribution set November 27 for Yoon Ga-eun’s The World of Love to open in select UK cinemas. The first venues include Curzon Bloomsbury in London and Filmhouse in Edinburgh. Seo Su-bin plays Jooin, a 17-year-old whose life is disrupted by anonymous notes.","url":"https://bulldog-film.com/films/the-world-of-love/","score":86,"status":"approved","summaryOrigin":"ai_assisted"},{"category":"영화","date":"2026-11-27","source":"Shochiku","title":"나카가와 류타로 감독 《너의 이야기》 일본 개봉","titleEn":"Ryutaro Nakagawa’s Kimi no Hanashi opens in Japan","summary":"쇼치쿠는 나카가와 류타로 감독의 영화 《너의 이야기》(君の話)를 11월 27일 일본 극장에 개봉한다고 안내했다. 기타무라 다쿠미와 데구치 나쓰키가 출연한다. 미아키 스가루의 소설을 원작으로, 만들어진 기억 속 인물이 현실에 나타나며 벌어지는 이야기를 그린다.","summaryEn":"Shochiku set November 27 for the Japanese theatrical release of Ryutaro Nakagawa’s Kimi no Hanashi. It stars Takumi Kitamura and Natsuki Deguchi. Based on Sugaru Miaki’s novel, the film follows a young man who encounters a person he thought existed only in a fabricated memory.","url":"https://www.shochiku.co.jp/cinema/lineup/kimino-hanashi/","score":82,"status":"approved","summaryOrigin":"ai_assisted"},{"category":"게임 산업","date":"2026-11-26","source":"Nintendo / Galaxy Grove","title":"철도 퍼즐 《Station to Station》 스위치 2 출시","titleEn":"Railway puzzler Station to Station comes to Switch 2","summary":"닌텐도는 《Station to Station》의 스위치 2 출시일을 11월 26일로 안내했다. 복셀로 그린 지역에 역을 놓고 철도 노선을 잇는 게임으로, 7개 지역에 54개 스테이지가 있다. 자유롭게 노선을 설계하는 창작 모드도 제공한다.","summaryEn":"Nintendo lists November 26 as the Switch 2 release date for Station to Station. Players build railway connections in voxel landscapes across 54 handcrafted levels and seven regions. A Creative Mode lets them build their own railway networks.","url":"https://www.nintendo.com/us/store/products/station-to-station-switch-2/","score":76,"status":"approved","summaryOrigin":"ai_assisted"}]''')
          tomorrow = {'issue': '2026-11-28', 'status': 'approved',
                      'items': sorted(additions + carry, key=lambda item: -item['score'])}
          assert len(tomorrow['items']) == 26
          saturday = output / '2026-11-28'
          (saturday / 'media').mkdir(parents=True)
          for item in tomorrow['items']:
              if item.get('image'):
                  for key in ('small', 'large'):
                      name = item['image'][key]
                      assert re.fullmatch(r'media/[a-z0-9-]+\.webp', name)
                      (saturday / name).write_bytes(fetch(origin + '/' + name, origin))
          illustration_layout = json.loads(r'''[{"index":1,"cell":0,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-01.webp","large":"media/nov28-illustration-01.webp","alt":"편집 삽화 · 해안 도시를 달리는 스포츠카","altEn":"Editorial illustration · Sports car in a coastal city","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":2,"cell":1,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-02.webp","large":"media/nov28-illustration-02.webp","alt":"편집 삽화 · 일본 갑옷과 칼","altEn":"Editorial illustration · Japanese armor and sword","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":3,"cell":2,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-03.webp","large":"media/nov28-illustration-03.webp","alt":"편집 삽화 · 스케이트보드·컨트롤러·랜턴","altEn":"Editorial illustration · Skateboard, controller and lantern","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":4,"cell":3,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-04.webp","large":"media/nov28-illustration-04.webp","alt":"편집 삽화 · 안개 속 전차","altEn":"Editorial illustration · Tank in a misty field","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":7,"cell":4,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-07.webp","large":"media/nov28-illustration-07.webp","alt":"편집 삽화 · 폭풍 속 범선","altEn":"Editorial illustration · Sailing ship in a storm","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":8,"cell":5,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-08.webp","large":"media/nov28-illustration-08.webp","alt":"편집 삽화 · 안개 낀 산길의 여행자","altEn":"Editorial illustration · Traveler on a misty mountain ridge","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":9,"cell":6,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-09.webp","large":"media/nov28-illustration-09.webp","alt":"편집 삽화 · 물 위에 나타난 음파와 카메라 렌즈","altEn":"Editorial illustration · Water ripples shaped like sound waves beside a camera lens","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":10,"cell":7,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-10.webp","large":"media/nov28-illustration-10.webp","alt":"편집 삽화 · 광장의 화려한 의상","altEn":"Editorial illustration · Ornate clothing in a city plaza","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":11,"cell":8,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-11.webp","large":"media/nov28-illustration-11.webp","alt":"편집 삽화 · 돌과 금속 표면 사이의 큐브","altEn":"Editorial illustration · Cube surrounded by stone and metal textures","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":13,"cell":9,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-13.webp","large":"media/nov28-illustration-13.webp","alt":"편집 삽화 · 고딕풍 탑 앞의 탐험가","altEn":"Editorial illustration · Explorers outside a Gothic tower","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":14,"cell":10,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-14.webp","large":"media/nov28-illustration-14.webp","alt":"편집 삽화 · 회로판의 푸른 큐브","altEn":"Editorial illustration · Blue cubes on a circuit board","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":16,"cell":11,"filename":"artwork-a.webp","columns":4,"rows":3,"image":{"small":"media/nov28-illustration-16.webp","large":"media/nov28-illustration-16.webp","alt":"편집 삽화 · 동굴 속 용과 보드게임 말","altEn":"Editorial illustration · Dragon and board game pieces in a cavern","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":17,"cell":0,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-17.webp","large":"media/nov28-illustration-17.webp","alt":"편집 삽화 · 학교 책상 위의 접힌 쪽지","altEn":"Editorial illustration · Folded notes on a school desk","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":18,"cell":1,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-18.webp","large":"media/nov28-illustration-18.webp","alt":"편집 삽화 · 해 질 녘 비어 있는 기차 승강장","altEn":"Editorial illustration · Empty train platform at dusk","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":19,"cell":2,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-19.webp","large":"media/nov28-illustration-19.webp","alt":"편집 삽화 · 분기하는 길이 있는 지도와 나침반","altEn":"Editorial illustration · Map with branching routes and a compass","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":20,"cell":3,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-20.webp","large":"media/nov28-illustration-20.webp","alt":"편집 삽화 · 수정 옆에 놓인 카드","altEn":"Editorial illustration · Playing cards beside a crystal","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":21,"cell":4,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-21.webp","large":"media/nov28-illustration-21.webp","alt":"편집 삽화 · 두 편의 말이 놓인 전술 보드","altEn":"Editorial illustration · Tactical board with pieces from two sides","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":22,"cell":5,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-22.webp","large":"media/nov28-illustration-22.webp","alt":"편집 삽화 · 빗물 맺힌 유리창에 비친 두 사람","altEn":"Editorial illustration · Two figures reflected in a rain-streaked window","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":23,"cell":6,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-23.webp","large":"media/nov28-illustration-23.webp","alt":"편집 삽화 · 호텔 로비 카운터 위의 열쇠","altEn":"Editorial illustration · Key on a hotel lobby counter","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":24,"cell":7,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-24.webp","large":"media/nov28-illustration-24.webp","alt":"편집 삽화 · 책상 위에 떠오른 빛나는 물체","altEn":"Editorial illustration · Glowing object floating above a desk","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}},{"index":26,"cell":8,"filename":"artwork-b.webp","columns":3,"rows":3,"image":{"small":"media/nov28-illustration-26.webp","large":"media/nov28-illustration-26.webp","alt":"편집 삽화 · 블록으로 만든 언덕을 지나는 기차","altEn":"Editorial illustration · Train winding through block-built hills","credit":"DE∀I AI 편집 삽화 / AI editorial illustration"}}]''')
          illustration_dir = Path('editorial/2026-11-28/illustrations')
