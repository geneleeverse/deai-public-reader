          payload = re.search(r'<script type="application/json" id="test-edition-data">(.*?)</script>', html, re.S)
          assert payload and 'content="noindex, nofollow"' in html
          previous = {item['url'] + '|' + item['titleEn']: item for item in json.loads(payload[1])['items']}
          revised = json.loads(r'''{"issue":"2026-11-28","status":"approved","items":[{"category":"게임 산업","date":"2026-11-23","source":"PlayStation","title":"플레이스테이션, 《GTA VI》를 역대 최대 출시로 발표","titleEn":"PlayStation calls GTA VI its biggest game launch","summary":"소니는 《GTA VI》가 플레이스테이션 역사상 가장 큰 게임 출시였다고 11월 23일 발표했다. 소니가 비교 범위로 밝힌 기간은 약 30년, 콘솔 세대로는 다섯 세대다. 소니 집계에 따르면 첫 주말까지 PS5에서 3,900만 명 이상이 플레이했고, 누적 플레이 시간은 6억 8,300만 시간이었다.","summaryEn":"Sony said on November 23 that GTA VI was the biggest game launch in PlayStation history. The company framed the comparison across roughly three decades and five console generations. Sony counted over 39 million unique PS5 players and 683 million cumulative hours through the opening weekend.","url":"https://blog.playstation.com/2026/11/23/thank-you-for-making-grand-theft-auto-vi-the-biggest-launch-in-playstation-history/","score":100,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-24","source":"Koei Tecmo / Xbox Wire","title":"《인왕 3》로 시리즈 첫 Xbox 진출","titleEn":"Nioh 3 marks the series’ Xbox debut","summary":"코에이테크모와 팀 닌자는 2027년 1월 28일 Xbox Series X·S에 《인왕 3》와 컴플리트 에디션을 출시할 예정이다. 컴플리트 에디션에는 본편과 스토리·보스 등을 추가하는 확장팩 두 편이 들어간다. 전투 중 사무라이와 닌자 스타일을 오갈 수 있다.","summaryEn":"Koei Tecmo and Team Ninja plan to release Nioh 3 and its Complete Edition on Xbox Series X and S on January 28, 2027. The Complete Edition includes the base game and two expansions with additions such as story content and bosses. Players can switch between Samurai and Ninja combat styles.","url":"https://news.xbox.com/en-us/2026/11/24/nioh-3-xbox-series-debut/","score":99,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"생성형 AI","date":"2026-11-23","source":"Google DeepMind / Google Quantum AI","title":"딥마인드, AI와 형식 검증으로 양자 알고리즘 개선","titleEn":"DeepMind uses agents and formal proofs to improve quantum algorithms","summary":"구글 딥마인드와 구글 퀀텀 AI는 11월 23일 AI 에이전트가 제안한 양자 알고리즘을 Lean으로 형식 검증한 공동 연구를 발표했다. 연구진이 문제를 정하고 탐색을 감독했으며, 특정 그로버 알고리즘 구현의 속도는 비용 추산에서 2.57배로 개선됐다. 연구진은 이 알고리즘들을 과학 시뮬레이션에 쓰려면 초기 오류 보정 양자컴퓨터가 감당하기 어려운 자원이 필요하다고 설명했다.","summaryEn":"On November 23, Google DeepMind and Google Quantum AI reported a joint study using Lean to formally verify quantum algorithms proposed by AI agents. Researchers chose the problems and supervised the search, and the team estimated a 2.57-fold speedup for one implementation of Grover’s algorithm. The team said running these algorithms in scientific simulations would still require more resources than early error-corrected quantum computers are expected to provide.","url":"https://deepmind.google/blog/finding-faster-quantum-algorithms-with-agents-and-formal-verification/","score":99,"status":"approved","summaryOrigin":"ai_assisted","image":{"small":"media/nov28-recut-generative-quantum.webp","large":"media/nov28-recut-generative-quantum.webp","alt":"편집 삽화 · 여러 선로가 합류하는 추상 양자 회로","altEn":"Editorial illustration · Abstract quantum circuit with converging lines","credit":"DE∀I 편집 삽화 / Editorial illustration"}},{"category":"게임 산업","date":"2026-11-25","source":"PlayStation","title":"PS Plus 12월 월간 게임 세 편 공개","titleEn":"PlayStation Plus announces three December monthly games","summary":"소니는 12월 월간 게임으로 《토니 호크의 프로 스케이터 3+4》, 《드래곤볼 제노버스 2》, 《암네시아: 더 벙커》를 발표했다. 세 작품은 12월 1일부터 1월 4일까지 모든 PS Plus 회원에게 제공될 예정이다.","summaryEn":"Sony announced Tony Hawk’s Pro Skater 3+4, Dragon Ball Xenoverse 2 and Amnesia: The Bunker as its December monthly games. All three are scheduled to be available to PlayStation Plus members from December 1 through January 4.","url":"https://blog.playstation.com/2026/11/25/playstation-plus-monthly-games-for-december-tony-hawks-pro-skater-34-dragon-ball-xenoverse-2-amnesia-the-bunker/","score":98,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"그래픽스","date":"2026-11-24","source":"NVIDIA","title":"《워 썬더》가 공개한 DLSS 5 색 처리 방식","titleEn":"War Thunder’s DLSS 5 integration adapts its color pipeline","summary":"엔비디아는 가이진이 《워 썬더》의 다고르 엔진에 DLSS 5를 통합한 방식을 공개했다. 게임은 후처리 전에 sRGB 공간에서 뉴럴 렌더링을 평가하고 결과를 다시 선형 HDR로 변환한다.","summaryEn":"NVIDIA described how Gaijin integrated DLSS 5 into War Thunder’s Dagor Engine. The game evaluates the neural rendering in sRGB before post-processing, then maps the result back to linear HDR.","url":"https://developer.nvidia.com/blog/whats-new-for-game-developers-ai-animation-and-rtx-tools/","score":97,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"Unreal","date":"2026-11-24","source":"NVIDIA","title":"언리얼 5.9 프리뷰의 시퀀서에 Kimodo 연동","titleEn":"Unreal 5.9 Preview integrates Kimodo into Sequencer","summary":"엔비디아의 Kimodo가 언리얼 엔진 5.9 프리뷰의 가이드 기반 애니메이션 시스템에 첫 모델로 들어갔다. 시퀀서에서 문장으로 움직임을 지정하고, 스플라인으로 이동 경로를 정하거나 특정 프레임에 목표 자세를 줄 수 있다.","summaryEn":"NVIDIA’s Kimodo became the first model integrated into Unreal Engine 5.9 Preview’s guided animation system. Sequencer can guide the generated motion with a description, a spline path or poses at particular frames.","url":"https://developer.nvidia.com/blog/whats-new-for-game-developers-ai-animation-and-rtx-tools/#guided_animation","score":96,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"기타 게임 엔진","date":"2026-11-24","source":"Godot Engine","title":"Godot 4.8, 릴리스 후보 전 추가 베타 배포","titleEn":"Godot 4.8 gets another beta before its release candidate","summary":"Godot 프로젝트는 4.8 출시를 막던 남은 문제를 해결했다고 밝혔다. 릴리스 후보로 넘어가기 전에 베타 5를 내고 수정 사항을 공개 환경에서 한 차례 더 시험한다.","summaryEn":"The Godot project reported that the remaining 4.8 release blockers had been resolved. Beta 5 gives those fixes another round of public testing before the release candidate.","url":"https://godotengine.org/article/dev-snapshot-godot-4-8-beta-5/","score":95,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"그래픽스","date":"2026-11-25","source":"DigitalMarsh","title":"《Captain’s Wake》가 공개한 폭풍 속 해상 전투","titleEn":"Captain’s Wake shows naval battles in stormy seas","summary":"DigitalMarsh가 언리얼 엔진 5 기반 해적 액션 RPG의 인게임 트레일러를 공개했다. 영상에는 폭풍 속 함포전, 눈보라가 치는 바다, 야간 와이번이 등장한다. 스튜디오는 무료 PC 데모를 12월 목표로 잡았다.","summaryEn":"DigitalMarsh released an in-game trailer for its Unreal Engine 5 pirate action RPG. It shows naval broadsides in storms, blizzard seas and nocturnal wyverns. The studio is targeting December for a free PC demo.","url":"https://www.gamespress.com/en-US/OFFICIAL-ANNOUNCEMENT-TRAILER-REVEALS-LIVING-PIRATE-SEAS-STORMY-BROADS","score":94,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"그래픽스","date":"2026-11-23","source":"Where Winds Meet","title":"《연운》, RTX 50 시리즈에 DLSS 5 지원 발표","titleEn":"Where Winds Meet announces DLSS 5 for RTX 50 cards","summary":"《연운》은 11월 24일부터 RTX 50 시리즈에서 DLSS 5를 지원한다고 발표했다. 제작진 설명에 따르면 기존 엔진이 만든 화면을 바탕으로 조명과 재질 표현을 보강한다. 공지에는 이 게임에 맞춰 최적화한 621.24 드라이버도 명시됐다.","summaryEn":"Where Winds Meet announced DLSS 5 support for RTX 50 cards starting November 24. The announcement describes enhancing lighting and material detail using the scene already rendered by the game. It also lists an optimized 621.24 driver.","url":"https://www.wherewindsmeetgame.com/kr/news/official/1123DLSS5.html","score":93,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"생성형 AI","date":"2026-11-24","source":"Sand AI","title":"Sand AI, 음성과 영상을 함께 생성하는 MAGI-2 공개","titleEn":"Sand AI introduces synchronized video and audio with MAGI-2","summary":"Sand AI가 영상과 소리를 함께 생성하는 MAGI-2를 공개했다. 회사에 따르면 최대 30초, 1080p, 초당 25프레임을 지원하고, 이미지·영상·오디오 참조를 합쳐 최대 20개 받아들인다. 기존 영상의 특정 부분을 편집하는 기능도 시연했다.","summaryEn":"Sand AI introduced MAGI-2, which generates video and synchronized sound together. The company says it supports up to 30 seconds at 1080p and 25 fps, with up to 20 image, video and audio references combined. It also demonstrated targeted edits to existing video.","url":"https://sand.ai/blog/magi-2","score":92,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-26","source":"Infold Games / PlayStation.Blog","title":"《인피니티 니키》 3.0, PS5에 두 도시 추가","titleEn":"Infinity Nikki 3.0 adds two cities on PS5","summary":"인폴드 게임즈는 11월 26일 PS5용 《인피니티 니키》 3.0 업데이트를 발표했다. 니키와 모모는 치치아와 세레미우스 두 도시를 탐험하며, 개발사는 새 이야기가 약 10시간 분량이라고 밝혔다. 새 탐험 능력과 확장된 전투 시스템도 추가됐다.","summaryEn":"Infold Games announced the November 26 release of Infinity Nikki 3.0 on PS5. Nikki and Momo explore the cities of Cicia and Ceremius in a new story that the developer says runs nearly 10 hours. The update also expands combat and introduces new exploration abilities.","url":"https://blog.playstation.com/2026/11/26/infinity-nikki-version-3-0-of-yesterday-and-tomorrow-update-live-today-on-ps5/","score":91,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"Unity","date":"2026-11-23","source":"Unity","title":"Unity 6.7, 신경망 기반 텍스처 압축 실험","titleEn":"Unity 6.7 experiments with neural texture compression","summary":"유니티는 Unity 6.7에 신경망 렌더링을 실험 기능으로 제공한다고 설명했다. 신경망 텍스처 압축은 URP 텍스처 세트를 압축한 뒤 실행 중 작은 신경망으로 복원한다. 유니티는 일반적인 URP 텍스처 세트에서 BCn 대비 메모리를 50% 적게 썼으며, 정식 지원은 Unity 7을 목표로 한다고 밝혔다.","summaryEn":"Unity outlined its experimental neural rendering support for Unity 6.7. Neural texture compression encodes URP texture sets and reconstructs them at runtime with a small neural network. Unity reported 50 percent lower memory use than BCn for a typical URP texture set and plans supported release in Unity 7.","url":"https://discussions.unity.com/t/neural-texture-compression-in-unity-6-7/1742548/1","score":90,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-27","source":"Bonfire Studios","title":"《Arkheron》, 콘솔과 스팀 얼리 액세스","titleEn":"Arkheron enters early access on consoles and Steam","summary":"본파이어 스튜디오는 11월 27일 PS5, Xbox Series X|S, 스팀에서 《Arkheron》 얼리 액세스를 시작한다고 안내했다. 3인 팀이 탑을 오르며 장비를 모아 경쟁하는 PvP 게임이다. 무료 프렌드 패스로 출시 주말에는 게임 전체를 체험할 수 있다.","summaryEn":"Bonfire Studios set November 27 as the early-access launch date for Arkheron on PS5, Xbox Series X|S, and Steam. Teams of three climb a tower, collect equipment, and fight rival teams in PvP. The free Friend Pass opens the full game to players during launch weekend.","url":"https://www.arkheron.com/en_US/play/","score":89,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"AI 개발 도구","date":"2026-11-25","source":"Alibaba Cloud","title":"알리바바, Qwen4-Max 프리뷰 호출을 정식 모델로 전환","titleEn":"Alibaba routes retired Qwen4-Max Preview calls to the production model","summary":"알리바바 클라우드는 11월 25일 Qwen4-Max 프리뷰를 종료했다. 기존 모델 ID 요청은 정식 Qwen4-Max로 자동 연결되며, 프리뷰 할인 대신 정식 요금이 적용된다.","summaryEn":"Alibaba Cloud retired Qwen4-Max Preview on November 25. Calls to the old model ID are automatically routed to Qwen4-Max at the standard rate, replacing the preview discount.","url":"https://help.aliyun.com/en/model-studio/newly-released-models","score":89,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"영화","date":"2026-11-25","source":"Netflix Tudum","title":"데이비드 핀처의 클리프 부스 신작, IMAX 2주 상영","titleEn":"David Fincher’s Cliff Booth film begins its two-week IMAX run","summary":"넷플릭스는 11월 25일 데이비드 핀처의 《The Further Mis-Adventures of Cliff Booth》가 세계 IMAX 극장에서 2주간 독점 상영을 시작했다고 밝혔다. 쿠엔틴 타란티노가 각본을 썼고, 브래드 피트가 1977년 할리우드에서 해결사로 일하는 클리프 부스로 돌아온다. 넷플릭스 공개는 12월 23일 예정이다.","summaryEn":"Netflix said on November 25 that David Fincher’s The Further Mis-Adventures of Cliff Booth had begun a two-week exclusive run in IMAX theaters worldwide. Quentin Tarantino wrote the screenplay, and Brad Pitt returns as Cliff Booth, now working as a Hollywood fixer in 1977. The Netflix premiere is scheduled for December 23.","url":"https://www.netflix.com/tudum/articles/david-fincher-new-film-release-date","score":89,"status":"approved","summaryOrigin":"ai_assisted","image":{"small":"media/nov28-recut-film-cliff.webp","large":"media/nov28-recut-film-cliff.webp","alt":"편집 삽화 · 황혼의 도시 위를 가로지르는 영사기 빛","altEn":"Editorial illustration · Projector beams crossing a city at dusk","credit":"DE∀I 편집 삽화 / Editorial illustration"}},{"category":"게임 산업","date":"2026-11-24","source":"Silver Lining Interactive / Kniv Studio","title":"한국산 《스타더스트》, PS5·스위치 2 출시일 확정","titleEn":"Korean RPG Stardust sets its PS5 and Switch 2 date","summary":"실버 라이닝 인터랙티브와 크니브스튜디오는 턴제 전략 RPG 《STARDUST: Wish of Witch》의 콘솔 디지털판이 12월 14일 나온다고 밝혔다. 대상은 PS5와 닌텐도 스위치 2이며, 두 플랫폼 패키지판은 별도로 예약을 받고 있다.","summaryEn":"Silver Lining Interactive and Kniv Studio announced that the digital console edition of turn-based strategy RPG STARDUST: Wish of Witch is coming December 14. It will launch on PS5 and Nintendo Switch 2, with physical editions available to preorder separately.","url":"https://www.gamespress.com/ko-KR/When-Stars-Align---STARDUST-Wish-of-Witch-Confirmed-to-Launch-on-Conso","score":88,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-24","source":"Monster Couch","title":"디지털 《Wyrmspan》, 12월 첫 공개 테스트","titleEn":"Digital Wyrmspan gets its first public test in December","summary":"Monster Couch가 디지털 보드게임 《Wyrmspan》의 첫 공개 테스트를 12월 10~14일 스팀에서 열 예정이다. 공식 양식으로 참가를 신청할 수 있다. 게임에서는 용 연구자가 동굴을 탐사해 여러 종류의 용이 머무를 보호구역을 만든다.","summaryEn":"Monster Couch plans to hold the first public Steam playtest of digital Wyrmspan from December 10 to 14. Players can sign up through the official form. The game casts them as dragon researchers exploring caves to build a sanctuary for diverse dragons.","url":"https://www.gamespress.com/ko-KR/First-Public-Wyrmspan-Playtest-Begins-Next-Month","score":87,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"영화","date":"2026-11-27","source":"Bulldog Film Distribution","title":"윤가은 감독 《세계의 주인》 영국 극장 개봉","titleEn":"Yoon Ga-eun’s The World of Love opens in UK cinemas","summary":"불독 필름 디스트리뷰션은 윤가은 감독의 《세계의 주인》을 11월 27일부터 영국 일부 극장에서 상영한다고 밝혔다. 첫 상영관에는 런던 커즌 블룸즈버리와 에든버러 필름하우스가 포함된다. 서수빈이 연기한 열일곱 살 주인에게 익명의 쪽지가 도착하면서 이야기가 시작된다.","summaryEn":"Bulldog Film Distribution set November 27 for Yoon Ga-eun’s The World of Love to open in select UK cinemas. The first venues include Curzon Bloomsbury in London and Filmhouse in Edinburgh. Seo Su-bin plays Jooin, a 17-year-old whose life is disrupted by anonymous notes.","url":"https://bulldog-film.com/films/the-world-of-love/","score":86,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-24","source":"Longplay Studios","title":"《Terminus: Day Zero》 스팀 무료 출시","titleEn":"Terminus: Day Zero launches as a free Steam game","summary":"Longplay Studios가 《Terminus: Zombie Survivors》와 같은 세계의 짧은 외전 《Day Zero》를 스팀에 무료로 출시했다. 전작 없이 즐길 수 있는 독립된 이야기로, 제작사는 플레이 시간이 한 시간 미만이라고 밝혔다. 한국어와 영어도 지원한다.","summaryEn":"Longplay Studios released Day Zero, a short standalone story set in the Terminus: Zombie Survivors universe, free on Steam. The studio says it takes under an hour and requires no prior experience with the series. Korean and English are supported.","url":"https://www.gamespress.com/ko-KR/Too-small-to-fight---free-zombie-survival-adventure-T-Longplay-Studios","score":86,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"게임 산업","date":"2026-11-24","source":"Glitch Factory","title":"《To Kill a God》, 1월 스팀 얼리 액세스 발표","titleEn":"To Kill a God sets its Steam Early Access date","summary":"Glitch Factory가 액션 로그라이크 RPG 《To Kill a God》의 스팀 얼리 액세스를 2027년 1월 12일로 예고했다. 게임에서는 진행 경로를 고르는 지도가 스킬 트리 역할을 한다. Xbox판은 같은 해 이후 출시 예정이다.","summaryEn":"Glitch Factory scheduled its action roguelike RPG To Kill a God for Steam Early Access on January 12, 2027. The map doubles as the skill tree, so route choices shape each build. An Xbox release is planned for later in 2027.","url":"https://www.gamespress.com/ko-KR/The-Map-is-the-Skill-Tree-in-To-Kill-A-God---Launching-in-Early-Access","score":85,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"영화","date":"2026-11-27","source":"Shochiku","title":"나카가와 류타로 감독 《너의 이야기》 일본 개봉","titleEn":"Ryutaro Nakagawa’s Kimi no Hanashi opens in Japan","summary":"쇼치쿠는 나카가와 류타로 감독의 영화 《너의 이야기》(君の話)를 11월 27일 일본 극장에 개봉한다고 안내했다. 기타무라 다쿠미와 데구치 나쓰키가 출연한다. 미아키 스가루의 소설을 원작으로, 만들어진 기억 속 인물이 현실에 나타나며 벌어지는 이야기를 그린다.","summaryEn":"Shochiku set November 27 for the Japanese theatrical release of Ryutaro Nakagawa’s Kimi no Hanashi. It stars Takumi Kitamura and Natsuki Deguchi. Based on Sugaru Miaki’s novel, the film follows a young man who encounters a person he thought existed only in a fabricated memory.","url":"https://www.shochiku.co.jp/cinema/lineup/kimino-hanashi/","score":82,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"영화","date":"2026-11-25","source":"KT&G 상상마당","title":"최창환 감독 《레이오버 호텔》 극장 개봉","titleEn":"Choi Chang-hwan’s Layover Hotel opens in cinemas","summary":"최창환 감독의 한국 독립영화 《레이오버 호텔》이 11월 25일 개봉했다. 102분의 영화는 항공편이 중단된 뒤 같은 호텔에서 하룻밤을 보내는 여섯 사람의 이야기를 따라간다. KT&G 상상마당 홍대는 11월 29일 상영을 편성했다.","summaryEn":"Choi Chang-hwan’s Korean independent film Layover Hotel opened on November 25. The 102-minute drama follows six people sharing a hotel for one night after their flight is disrupted. KT&G Sangsangmadang Hongdae lists a November 29 screening.","url":"https://www.sangsangmadang.com/movie/detail/M000122046","score":82,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"영화","date":"2026-11-25","source":"Disney","title":"디즈니 애니메이션 《Hexed》 미국 극장 개봉","titleEn":"Disney’s Hexed opens in U.S. theaters","summary":"월트 디즈니 애니메이션 스튜디오의 《Hexed》가 11월 25일 미국 극장에 나왔다. 공식 작품 소개와 예고편은 마법과 맞닥뜨리는 빌리 도를 중심으로 이야기를 소개한다. 헤일리 스타인펠드가 빌리의 목소리를 맡았다.","summaryEn":"Walt Disney Animation Studios’ Hexed opened in U.S. theaters on November 25. The studio’s film page and trailer center the story on Billie Doe’s encounter with magic. Hailee Steinfeld voices Billie.","url":"https://movies.disney.com/hexed","score":81,"status":"approved","summaryOrigin":"ai_assisted","image":null},{"category":"그래픽스","date":"202