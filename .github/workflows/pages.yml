                  for i,h in enumerate((75,124,98,149,101,180,93,126,84,105,147,72)):
                      x=12+67*i
                      d.rectangle((x,460-h,x+51,460),fill='#181725')
                      for j in range(2):
                          d.rectangle((x+12+j*16,480-h,x+18+j*16,485-h),fill='#f0a068')
                  d.polygon([(82,284),(635,57),(735,193),(82,300)],fill='#e7aa72')
                  d.rounded_rectangle((37,268,105,323),radius=9,fill='#161521')
                  d.ellipse((45,236,78,269),fill='#161521')
              elif name == 'game-miner':
                  d.rectangle((0,0,800,460),fill='#20183b')
                  for i in range(7):
                      x=70+i*91
                      y=352-i*37
                      d.rectangle((x,y,x+89,440), fill=('#6b396c' if i%2 else '#9f5d73'))
                      d.rectangle((x,y,x+89,y+10),fill='#efac66')
                  for x,y in ((230,170),(430,115),(630,58)):
                      d.rectangle((x,y,x+13,y+53),fill='#87e2c4')
