      - name: Retrieve the existing verified Pages artifact
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish only the approved DEAI rehearsal' }}
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: baseline
          run-id: '45944807766'
          github-token: ${{ github.token }}
      - name: Restore the published site byte for byte
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish only the approved DEAI rehearsal' }}
        run: |
          mkdir dist
          tar --no-same-owner -xf baseline/artifact.tar -C dist
          test -f dist/index.html
          test -f dist/2026-11-28/index.html
      - name: Restore the current Pages artifact for the Saturday revision
